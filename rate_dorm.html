<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorm Scope | Rate a Dorm</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/rate_dorm.css">
  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/components/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/rate_dorm.js" defer></script>
</head>

<body>
  <header>
    <site-navbar></site-navbar>
  </header>

  <main class="rate-page">
    <section class="rate-intro">
      <h1>Rate a Dorm</h1>
      <p>Share your experience by rating a dorm and leaving a comment.</p>
    </section>

    <section class="rate-form-section">
      <p class="rate-context" aria-live="polite">Checking which dorm you want to review...</p>
      <form class="rate-form">
        <fieldset class="rate-fieldset">
          <legend>Leave a rating</legend>

          <div class="rate-field">
            <label for="author-name">Your name</label>
            <input type="text" id="author-name" name="author-name" placeholder="Your first name" required>
          </div>

          <div class="rate-field">
            <label for="rating">Rating (1-5)</label>
            <input type="number" id="rating" name="rating" min="1" max="5" value="3" required>
          </div>

          <div class="rate-field">
            <label for="comment">Comment</label>
            <textarea id="comment" name="comment" rows="5" placeholder="Share your dorm experience" required></textarea>
          </div>

          <button class="rate-submit" type="submit">Submit</button>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    <site-footer></site-footer>
  </footer>
</body>

</html>

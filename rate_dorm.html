<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorm Scope | Rate a Dorm</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/components/index.js"></script>
</head>

<body>
  <site-navbar></site-navbar>

  <main>
    <section>
      <h1>Rate a Dorm</h1>
      <p>Share your experience by rating a dorm and leaving a comment.</p>
    </section>

    <section>
      <form action="#" method="post">
        <fieldset>
          <legend>Leave a rating</legend>

          <div>
            <label for="dorm-name">Dorm name</label>
            <input type="text" id="dorm-name" name="dorm-name" placeholder="Dorm A" required>
          </div>

          <div>
            <label for="rating">Rating (1-5)</label>
            <input type="number" id="rating" name="rating" min="1" max="5" value="3" required>
          </div>

          <div>
            <label for="comment">Comment</label>
            <textarea id="comment" name="comment" rows="5" placeholder="Share your dorm experience" required></textarea>
          </div>

          <button type="submit">Submit</button>
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    <site-footer></site-footer>
  </footer>
</body>

</html>

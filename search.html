<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dorm Scope | Search</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/listing.css">
  <link rel="stylesheet" href="css/search.css">
  <script src="js/config.js"></script>
  <script src="js/components/index.js"></script>
  <script src="js/search.js" defer></script>
</head>

<body>
  <header>
    <site-navbar></site-navbar>
  </header>

  <main>
    <section>
      <h1>Search Dorms</h1>
      <form id="search-form" action="search.html" method="get" novalidate>
        <fieldset>
          <legend>Filter dorms</legend>
          <div>
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="e.g. York University campus" minlength="2" maxlength="80">
          </div>
          <div>
            <label for="max-price">Max Price</label>
            <span class="range-control">
              <input type="range" step="50" min="300" max="2000" value="2000" id="max-price" name="max-price">
              <output id="max-price-value" for="max-price">$2000</output>
            </span>
          </div>
          <div>
            <label for="roommates">Number of roommates</label>
            <input type="number" min="0" max="3" id="roommates" name="roommates">
          </div>
          <div>
            <label for="kitchen">Includes Kitchen</label>
            <input type="checkbox" id="kitchen" name="kitchen">
          </div>
          <button type="submit">Search</button>
        </fieldset>
        <p id="search-error" class="search-message search-message-error" role="alert" hidden></p>
      </form>
    </section>

    <section class="search-results" aria-live="polite">
      <h2>Results</h2>
      <p id="search-status" class="search-message">Loading dorm listings...</p>
      <div id="search-results-list"></div>
    </section>
  </main>

  <footer>
    <site-footer></site-footer>
  </footer>
</body>

</html>

<html>

<head>
  <title>Dorm Scope</title>
  <meta charset="UTF-8">
  <script src="js/components.js" defer></script>
</head>

<body>
  <site-navbar></site-navbar>

  <form action="search.html" method="get">
    <h4>Filter by:</h4>
    <label for="location">Location:</label>
    <input type="text" id="location"><br>

    <label for="max price">Max Price:</label>
    <input type="range" step=50 min=300 max=2000 value=500 id="max-price"><br>

    <label for="roommates"># Of Room mates:</label>
    <input type="number" min=0 max=3 id="roommates"><br>

    <label for"kitchen">Includes Kitchen</label>
    <input type="checkbox" id="kitchen"><br>

    <button type=" submit">Search</button>
  </form>

  <h1>Search Results</h1>
  <div class="search-results">
    <h2>Results</h2>
    <div>
      <h3>Dorm A</h3>
      <h4>Near Campus</h4>
      <h5>Number of roommates: 2</h5>
      <h5>Price: $300/month</h5>
    </div>
    <div>
      <h3>Dorm Z</h3>
      <h4>On Campus</h4>
      <h5>Number of roommates: 1</h5>
      <h5>Price: $550/month</h5>
    </div>
    <div>
      <h3>Dorm F</h3>
      <h4>Near Campus</h4>
      <h5>Number of roommates: 3</h5>
      <h5>Price: $350/month</h5>
    </div>
  </div>

  <site-footer></site-footer>
</body>

</html>
